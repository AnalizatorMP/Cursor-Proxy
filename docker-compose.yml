version: "3.8"
services:
  xray:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        XRAY_VERSION: "26.1.13"
    container_name: xray-ubuntu
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:10808:10808"
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    environment:
      - XRAY_CONFIG=/etc/xray/config.json
      - XRAY_TRANSPARENT_PORT=12345
      - XRAY_ROUTE_CIDRS=13.107.0.0/16 18.66.0.0/16 20.118.0.0/16 23.35.0.0/16 104.18.0.0/16 142.250.0.0/16 172.64.0.0/16 184.105.0.0/16 188.114.0.0/16
      - XRAY_ROUTE_DOMAINS=ifconfig.me
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "xray run -test -c /etc/xray/config.json"]
      interval: 30s
      timeout: 10s
      retries: 3
